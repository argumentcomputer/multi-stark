# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/main/json-schema/pinact.json
version: 3

ignore_actions:
  # ci-workflows publishes no tags, so its actions are pinned to a commit of
  # `main` and carry no release comment for pinact to verify.
  - name: argumentcomputer/ci-workflows/.*
    ref: "[0-9a-f]{40}"
