name: Build and Test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: argumentcomputer/ci-workflows
      - uses: ./.github/actions/ci-env
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@nextest
      - name: Linux Tests
        run: |
          cargo nextest run --profile ci --cargo-profile dev-ci --workspace --features parallel

  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: argumentcomputer/ci-workflows
      - uses: ./.github/actions/ci-env
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Check Rustfmt code style
        run: cargo fmt --all --check
      # Runtime correctness is validated on NVIDIA runners via cuda/smoke.sh. Keep the
      # ordinary CI path independent of the CUDA toolkit.
      - name: Check CPU targets compile
        run: cargo check --release --all-targets --features parallel --workspace
      - name: Check clippy lints
        run: cargo clippy --release --workspace --all-targets --features parallel
      - name: Doctests
        run: cargo test --doc --workspace
      - name: Get Rust version
        run: |
          echo "RUST_VERSION=$(awk -F '"' '/^channel/ {print $2}' rust-toolchain.toml)" | tee -a $GITHUB_ENV
      # Lint dependencies for licensing and auditing issues as per `deny.toml`
      - name: Cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: ${{ env.RUST_VERSION }}

  cuda-compile:
    # A toolkit container is sufficient for compile coverage; no GPU runner
    # is needed. The runner request mirrors Ix CI, the downstream consumer
    # of the CUDA backend. The container cannot see a host bind mount, so
    # its Cargo cache lives in the S3-backed actions cache.
    runs-on: runs-on=${{ github.run_id }}-cuda-compile-${{ github.run_attempt }}/cpu=8/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/extras=s3-cache
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      # The devel image ships build-essential (a dependency of cuda-nvcc)
      # and ca-certificates, but purges curl after adding NVIDIA's apt
      # repository, and the toolchain action fetches rustup with curl.
      - name: Install curl for the rustup installer
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends curl
      # Codegen comes from .cargo/config.toml, as in the other jobs. The action
      # sets build.warnings=deny, which makes cargo fail on clippy warnings
      # too, so the clippy command below does not repeat -D warnings.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Compile and lint CUDA targets
        run: cargo clippy --release --locked --all-targets --features parallel,cuda
